# Standalone frontend container; use the Auth backend service name on the same network.
upstream auth_backend {
    server auth:9000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Rewrite forwarding headers; merge these routes into the HTTPS server in production.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";

    location = /auth { return 308 /auth/; }

    # Keep the /auth prefix; page URLs never reach the backend.
    location ^~ /auth/api/ {
        proxy_pass http://auth_backend;
    }
    location ^~ /auth/oauth2/ {
        proxy_pass http://auth_backend;
    }
    location ^~ /auth/.well-known/ {
        proxy_pass http://auth_backend;
    }
    location ^~ /auth/connect/ {
        proxy_pass http://auth_backend;
    }
    location = /auth/userinfo {
        proxy_pass http://auth_backend;
    }
    location ^~ /auth/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /auth/index.html;
    }
}
