# 构建测试不使用实际 dev/prod 配置，也不连接外部服务。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:1/parabbs_test
    username: test
    password: test
  data:
    redis:
      host: 127.0.0.1
      port: 1
      password: ""
      database: 0
      connect-timeout: 100ms
      timeout: 100ms
      lettuce:
        pool:
          max-active: 2
          max-idle: 2
          min-idle: 0
          max-wait: 100ms
  elasticsearch:
    uris: http://127.0.0.1:1
  rabbitmq:
    host: 127.0.0.1
    port: 1
    username: test
    password: test
    virtual-host: /
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

jwt:
  secret: test-only-key-not-for-production-0123456789
  access-token-expire: 1800
  refresh-token-expire: 3600

para:
  file:
    managed:
      root-path: ./target/test-images/
      public-base-url: https://example.invalid/images/
  github:
    token: test-only-token
